services:
  msp:
    container_name: msp-go
    image: mochigome/msp-go:2.22.5
    restart: always
    stop_grace_period: 30s
    env_file:
      - .env.local
    # Only needed when MQTTS_ON=true with certificate files.
    # The container runs as uid 65532: make the files readable by it.
    # volumes:
    #   - ./certs:/app/certs:ro
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "10"
